<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jejak Benang 2035 — Mockup Interaktif</title>
<meta name="description" content="Mockup interaktif Jejak Benang 2035: Immersive Carbon-Aware Shopping untuk fashion berkelanjutan. Data simulasi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
html,body{margin:0;height:100%;background:#ECE8E0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#fit{width:460px;height:940px;flex:none;transform-origin:center center}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #F4A93B;outline-offset:2px}
*::-webkit-scrollbar{display:none}
.note{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#5D6270;pointer-events:none}
@media (max-height:700px){.note{display:none}}
</style>
</head>
<body>
<div id="stage"><div id="fit"><div id="app"></div></div></div>
<div class="note">Mockup UTS · Jejak Benang 2035 · semua angka, merek, dan harga adalah data simulasi</div>
<script type="module">
import { html, render, Component } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';
class App extends Component {
constructor(props) {
super(props);
this.state = this.initial(props.start);
}
initial(start) {
const hist = [
{ t: 'Memilih kemeja katun organik', s: '±4,3 kg CO₂e dihindari', p: '+20' },
{ t: 'Menonton Carbon Journey', s: 'Kemeja Oxford Indigo · 5 babak', p: '' },
{ t: 'Memindai Kemeja Oxford Indigo', s: 'Rupa Tenun · Majalaya', p: '' }
];
const done = [true, true, true, true, true];
const base = { screen: 'home', phase: 'aim', stage: -1, ch: 0, t: 0, playing: false, counted: false, watched: [false, false, false, false, false], pick: 'org', bought: 'org', sheet: '', points: 120, saved: 8.4, scans: 0, journeys: 0, orgBuys: 0, history: [], liked: false, torch: false, remind: true, dye: false, truck: false, swap: false, audit: false, toast: '', from: 'home' };
const presets = {
scan: { screen: 'scan' },
scanned: { screen: 'scan', phase: 'found', scans: 1, history: hist.slice(2) },
product: { screen: 'product', stage: 1, from: 'scan', scans: 1, history: hist.slice(2) },
proof: { screen: 'product', sheet: 'proof', from: 'scan', scans: 1, history: hist.slice(2) },
journey: { screen: 'journey', ch: 1, t: 45, watched: [true, false, false, false, false], scans: 1, history: hist.slice(2) },
compare: { screen: 'compare', scans: 1, journeys: 1, watched: done, counted: true, history: hist.slice(1) },
success: { screen: 'success', points: 140, saved: 12.7, scans: 1, journeys: 1, orgBuys: 1, watched: done, counted: true, history: hist },
impact: { screen: 'impact', points: 140, saved: 12.7, scans: 1, journeys: 1, orgBuys: 1, watched: done, counted: true, history: hist },
brand: { screen: 'brand', points: 140, saved: 12.7, scans: 1, journeys: 1, orgBuys: 1, watched: done, counted: true, history: hist, dye: true }
};
return Object.assign(base, presets[start] || {});
}
componentDidMount() { this.iv = setInterval(() => this.tick(), 200); }
componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tt); clearTimeout(this.st); }
componentDidUpdate(prev) { if (prev.start !== this.props.start) this.setState(this.initial(this.props.start)); }
tick() {
const s = this.state;
if (s.screen !== 'journey' || !s.playing) return;
if (s.t + 2 < 100) { this.setState({ t: s.t + 2 }); return; }
this.advance();
}
advance() {
const s = this.state;
const watched = s.watched.slice();
watched[s.ch] = true;
if (s.ch < 4) { this.setState({ ch: s.ch + 1, t: 0, watched }); return; }
this.setState(Object.assign({ t: 100, playing: false, watched }, this.countJourney(s)));
}
countJourney(s) {
if (s.counted) return {};
return { counted: true, journeys: s.journeys + 1, history: [{ t: 'Menonton Carbon Journey', s: 'Kemeja Oxford Indigo · 5 babak', p: '' }].concat(s.history) };
}
toast(msg) {
this.setState({ toast: msg });
clearTimeout(this.tt);
this.tt = setTimeout(() => this.setState({ toast: '' }), 2400);
}
go(screen, extra) { this.setState(Object.assign({ screen, sheet: '' }, extra || {})); }
num(x) { return x.toFixed(1).replace('.', ','); }
num2(x) { return x.toFixed(2).replace('.', ','); }
renderVals() {
const s = this.state;
const v = {};
['home', 'scan', 'product', 'journey', 'compare', 'success', 'impact', 'brand'].forEach(n => {
const on = s.screen === n;
v[n] = { op: on ? 1 : 0, vis: on ? 'visible' : 'hidden', pe: on ? 'auto' : 'none', tf: on ? 'none' : 'translateY(14px) scale(0.985)' };
});
const sheet = (k) => {
const on = s.sheet === k;
return { op: on ? 1 : 0, pe: on ? 'auto' : 'none', tf: on ? 'translateY(0)' : 'translateY(105%)', vis: on ? 'visible' : 'hidden' };
};
const stageData = [
{ name: 'Kapas organik', short: 'Kapas', kg: 1.87, pct: 34, color: '#1B2766', note: 'Ditanam tanpa pestisida sintetis. Air irigasi menjadi penyumbang emisi terbesar di tahap ini.' },
{ name: 'Tenun & celup', short: 'Celup', kg: 1.65, pct: 30, color: '#3F57AE', note: 'Ditenun di Majalaya dengan pewarna indigo alami. Air bekas celup diolah lalu dipakai ulang.' },
{ name: 'Pengiriman', short: 'Kirim', kg: 0.66, pct: 12, color: '#F4A93B', note: 'Dikirim dengan truk dari Majalaya ke gudang Bandung, sekitar 32 km.' },
{ name: 'Pakai & cuci', short: 'Cuci', kg: 0.88, pct: 16, color: '#8FA3DF', note: 'Perkiraan untuk 50 kali cuci. Cuci air dingin dan jemur matahari memangkas tahap ini.' },
{ name: 'Akhir pakai', short: 'Akhir', kg: 0.44, pct: 8, color: '#C7D0EE', note: 'Bisa dikembalikan lewat program tukar baju untuk dipakai ulang atau didaur ulang.' }
];
const chap = [
{ title: 'Ladang kapas organik', text: 'Serat kemeja ini tumbuh di ladang kapas organik. Tahap ini menyumbang 34% jejak karbonnya, terutama dari air irigasi.', cx: 182, cy: 236 },
{ title: 'Tenun & pencelupan', text: 'Kain ditenun dan dicelup indigo alami di Majalaya. Air bekas celup diolah lalu dipakai ulang, jadi emisinya lebih rendah.', cx: 30, cy: 372 },
{ title: 'Perjalanan ke toko', text: 'Truk membawa kemeja ini sekitar 32 km ke gudang Bandung. Jarak yang pendek membuat tahap ini hanya 12% dari total.', cx: 196, cy: 322 },
{ title: 'Dipakai & dicuci', text: 'Setiap cucian air panas menambah emisi. Cuci air dingin dan jemur di bawah matahari agar tahap ini tetap kecil.', cx: 30, cy: 230 },
{ title: 'Babak baru: tukar baju', text: 'Saat bosan, kembalikan kemeja ini ke program tukar baju. Pakaian dipakai ulang, bukan berakhir di TPA.', cx: 196, cy: 380 }
];
const toastOn = !!s.toast;
const ph = s.phase;
const found = ph === 'found';
const finished = s.ch === 4 && s.t >= 100;
const org = s.pick === 'org';
const boughtOrg = s.bought === 'org';
const rewardDefs = [
{ title: 'Tukar 1 pakaian gratis', sub: 'Program tukar baju mitra', cost: 100, letter: 'T', tint: '#E5F0E8', ink: '#1D6B3F' },
{ title: 'Diskon jahit ulang 25%', sub: 'Penjahit mitra di Bandung', cost: 150, letter: 'J', tint: '#E8EBF6', ink: '#283B8E' },
{ title: 'Adopsi 1 tanaman kapas', sub: 'Koperasi petani organik', cost: 250, letter: 'K', tint: '#FBEBD3', ink: '#9A5A12' }
];
const next = rewardDefs.find(r => r.cost > s.points);
const simDefs = [
{ key: 'dye', label: 'Pewarna alami', cut: 0.9 },
{ key: 'truck', label: 'Truk listrik', cut: 0.3 },
{ key: 'swap', label: 'Program tukar baju', cut: 0.4 }
];
let simKg = 5.5;
simDefs.forEach(d => { if (s[d.key]) simKg -= d.cut; });
const noChange = !simDefs.some(d => s[d.key]);
const simGrade = simKg < 5 ? 'A' : 'B';
const cards = [
{ name: 'Kemeja Oxford Indigo', brand: 'Rupa Tenun', kg: '5,5', grade: 'B', gc: '#3C7F4D', gt: '#FFFFFF', bg: '#E6E9F4', price: 'Rp 389.000', isShirt: true, isChino: false, isTee: false, isJacket: false, full: true },
{ name: 'Chino Katun Organik', brand: 'Lembar Studio', kg: '4,1', grade: 'A', gc: '#1D6B3F', gt: '#FFFFFF', bg: '#F1EBDD', price: 'Rp 429.000', isShirt: false, isChino: true, isTee: false, isJacket: false },
{ name: 'Kaus Serat Bambu', brand: 'Akar Kain', kg: '2,3', grade: 'A', gc: '#1D6B3F', gt: '#FFFFFF', bg: '#E7EFE5', price: 'Rp 189.000', isShirt: false, isChino: false, isTee: true, isJacket: false },
{ name: 'Jaket Denim Daur Ulang', brand: 'Ulang Denim', kg: '8,1', grade: 'C', gc: '#E2B33C', gt: '#14171F', bg: '#E3E9F1', price: 'Rp 549.000', isShirt: false, isChino: false, isTee: false, isJacket: true }
].map(c => Object.assign({}, c, { open: c.full ? () => this.go('product', { from: 'home', stage: -1 }) : () => this.toast('Prototipe ini menampilkan detail lengkap untuk Kemeja Oxford Indigo') }));
const goJourneyAt = (i) => () => this.go('journey', { ch: i, t: 0, playing: true, counted: s.counted });
return {
scr: v,
sh: { proof: sheet('proof'), why: sheet('why') },
homeBar: s.screen === 'scan' || s.screen === 'journey' ? '#FFFFFF' : '#14171F',
toast: { op: toastOn ? 1 : 0, tf: toastOn ? 'translateY(0)' : 'translateY(-10px)', text: s.toast },
points: s.points,
scans: s.scans,
journeys: s.journeys,
orgBuys: s.orgBuys,
savedText: this.num(s.saved),
cards,
goHome: () => this.go('home'),
goScan: () => this.go('scan', { phase: 'aim' }),
goImpact: () => this.go('impact'),
goBrand: () => this.go('brand'),
goCompare: () => this.go('compare'),
bell: () => this.toast('Belum ada notifikasi baru'),
seeAll: () => this.toast('Katalog lengkap tidak termasuk dalam prototipe ini'),
ret: ph === 'aim' ? { l: '56px', t: '166px', w: '281px', h: '384px', c: '#FFFFFF', op: 1 } : { l: '72px', t: '196px', w: '249px', h: '330px', c: '#F4A93B', op: found ? 0 : 1 },
beam: { top: ph === 'aim' ? '200px' : '508px', op: ph === 'lock' ? 1 : 0 },
tags: { op: found ? 1 : 0, tf: found ? 'scale(1)' : 'scale(0.92)' },
cam: { op: found ? 0 : 1, pe: found ? 'none' : 'auto' },
found: { tf: found ? 'translateY(0)' : 'translateY(110%)' },
scanHint: ph === 'aim' ? 'Arahkan ke pakaian' : ph === 'lock' ? 'Mengenali pakaian…' : 'Kemeja dikenali',
scanDot: ph === 'aim' ? '#FFFFFF' : ph === 'lock' ? '#F4A93B' : '#5FD38A',
shutterIn: ph === 'lock' ? '#F4A93B' : '#FFFFFF',
shutterTf: ph === 'lock' ? 'scale(0.82)' : 'scale(1)',
torch: s.torch,
torchBg: s.torch ? '#F4A93B' : 'rgba(20, 20, 22, 0.45)',
torchFg: s.torch ? '#14171F' : '#FFFFFF',
torchGlow: s.torch ? 0.14 : 0,
toggleTorch: () => this.setState({ torch: !s.torch }),
gallery: () => this.toast('Pilih foto label dari galeri (tidak aktif di prototipe)'),
flip: () => this.toast('Kamera depan tidak dipakai untuk memindai'),
shoot: () => {
if (s.phase !== 'aim') return;
this.setState({ phase: 'lock' });
clearTimeout(this.st);
this.st = setTimeout(() => {
const n = this.state;
this.setState({ phase: 'found', scans: n.scans + 1, history: [{ t: 'Memindai Kemeja Oxford Indigo', s: 'Rupa Tenun · Majalaya', p: '' }].concat(n.history) });
}, 1400);
},
rescan: () => this.setState({ phase: 'aim' }),
closeScan: () => this.go('home', { phase: 'aim' }),
goProductScan: () => this.go('product', { from: 'scan', stage: -1 }),
backProduct: () => this.go(s.from === 'scan' ? 'scan' : 'home'),
liked: s.liked,
likeFill: s.liked ? '#E0533D' : 'none',
likeStroke: s.liked ? '#E0533D' : '#14171F',
toggleLike: () => { this.setState({ liked: !s.liked }); if (!s.liked) this.toast('Disimpan ke favorit'); },
share: () => this.toast('Tautan produk disalin'),
openProof: () => this.setState({ sheet: 'proof' }),
openWhy: () => this.setState({ sheet: 'why' }),
closeSheet: () => this.setState({ sheet: '' }),
stages: stageData.map((d, i) => ({
name: d.name, color: d.color, note: d.note, pct: d.pct + '%', kg: this.num2(d.kg),
open: s.stage === i,
dim: s.stage < 0 || s.stage === i ? 1 : 0.3,
rowBg: s.stage === i ? '#F3F5FC' : 'transparent',
chev: s.stage === i ? 'rotate(90deg)' : 'none',
toggle: () => this.setState({ stage: s.stage === i ? -1 : i }),
play: goJourneyAt(i)
})),
journeyCta: s.stage >= 0 ? 'Putar babak ' + stageData[s.stage].short : 'Carbon Journey',
goJourney: goJourneyAt(s.stage >= 0 ? s.stage : 0),
jsc: { s0: s.ch === 0 ? 1 : 0, s1: s.ch === 1 ? 1 : 0, s2: s.ch === 2 ? 1 : 0, s3: s.ch === 3 ? 1 : 0, s4: s.ch === 4 ? 1 : 0 },
segs: chap.map((c, i) => ({
w: (i < s.ch ? 100 : i === s.ch ? s.t : 0) + '%',
aria: 'Babak ' + (i + 1) + ': ' + stageData[i].short,
go: () => this.setState({ ch: i, t: 0, playing: true })
})),
cur: { num: s.ch + 1, title: chap[s.ch].title, text: chap[s.ch].text, kg: this.num2(stageData[s.ch].kg), pct: stageData[s.ch].pct + '%', cx: chap[s.ch].cx + 'px', cy: chap[s.ch].cy + 'px' },
showPause: s.playing,
showPlay: !s.playing,
playLabel: s.playing ? 'Jeda narasi' : 'Putar narasi',
togglePlay: () => {
if (finished) { this.setState({ ch: 0, t: 0, playing: true }); return; }
this.setState({ playing: !s.playing });
},
jPrev: () => {
if (s.t > 15) { this.setState({ t: 0 }); return; }
this.setState({ ch: Math.max(0, s.ch - 1), t: 0 });
},
jNext: () => this.advance(),
isLast: s.ch === 4,
notLast: s.ch < 4,
journeyToCompare: () => {
const watched = s.watched.slice();
watched[4] = true;
this.setState(Object.assign({ screen: 'compare', sheet: '', playing: false, watched }, this.countJourney(s)));
},
backJourney: () => this.go('product', { playing: false }),
vr: () => this.toast('Pasang headset VR untuk mode imersif penuh'),
backCompare: () => this.go('product'),
cmpOrg: { on: org, border: org ? '2px solid #283B8E' : '1px solid #E6E1D8' },
cmpPoly: { on: !org, border: org ? '1px solid #E6E1D8' : '2px solid #283B8E' },
pickOrg: () => this.setState({ pick: 'org' }),
pickPoly: () => this.setState({ pick: 'poly' }),
diff: [['Bahan baku', 1.87, 3.97], ['Tenun & celup', 1.65, 3.25], ['Pengiriman', 0.66, 0.66], ['Pakai & cuci', 0.88, 0.88], ['Akhir pakai', 0.44, 1.04]].map(r => ({ name: r[0], a: Math.round(r[1] / 3.97 * 100) + '%', b: Math.round(r[2] / 3.97 * 100) + '%', av: this.num2(r[1]), bv: this.num2(r[2]) })),
pickName: org ? 'Oxford' : 'Basic Print',
pickPrice: org ? 'Rp 389.000' : 'Rp 159.000',
pickHint: org ? '+20 Carbon Points' : 'Tanpa Carbon Points',
pickHintColor: org ? '#1D6B3F' : '#5D6270',
buy: () => {
const o = s.pick === 'org';
this.setState({
screen: 'success', sheet: '', bought: s.pick,
points: s.points + (o ? 20 : 0),
saved: Math.round((s.saved + (o ? 4.3 : 0)) * 10) / 10,
orgBuys: s.orgBuys + (o ? 1 : 0),
history: [{ t: o ? 'Memilih kemeja katun organik' : 'Memilih kemeja poliester', s: o ? '±4,3 kg CO₂e dihindari' : 'Tips perawatan dikirim', p: o ? '+20' : '' }].concat(s.history)
});
},
boughtOrg,
boughtPoly: !boughtOrg,
succ: boughtOrg
? { ring: '#1D6B3F', title: 'Pilihan yang lebih ringan!', text: 'Pesanan Kemeja Oxford Indigo sudah dibuat. Terima kasih sudah memilih dengan sadar.', product: 'Kemeja Oxford Indigo · M', ship: 'Dikirim dari Majalaya · 2–3 hari', price: 'Rp 389.000', shirt: '#3B55A8', thumbBg: '#E6E9F4' }
: { ring: '#283B8E', title: 'Pesanan dibuat', text: 'Pesanan Kemeja Basic Print sudah dibuat. Ini beberapa cara agar dampaknya tetap kecil.', product: 'Kemeja Basic Print · M', ship: 'Dikirim dari gudang impor · 5–7 hari', price: 'Rp 159.000', shirt: '#D96A4F', thumbBg: '#F6E5DE' },
remind: s.remind,
sw: { bg: s.remind ? '#283B8E' : '#CFC9BE', tf: s.remind ? 'translateX(20px)' : 'none' },
toggleRemind: () => { this.setState({ remind: !s.remind }); this.toast(s.remind ? 'Pengingat dimatikan' : 'Kami akan mengingatkanmu dalam 6 bulan'); },
nextPct: (next ? Math.min(100, Math.round(s.points / next.cost * 100)) : 100) + '%',
nextText: next ? 'Kurang ' + (next.cost - s.points) + ' poin untuk “' + next.title + '”' : 'Semua hadiah bisa ditukar',
rewards: rewardDefs.map(r => {
const can = s.points >= r.cost;
return Object.assign({}, r, {
label: r.cost + ' poin',
btnBg: can ? '#283B8E' : '#ECE8E0',
btnFg: can ? '#FFFFFF' : '#5D6270',
redeem: () => {
if (!can) { this.toast('Poin belum cukup untuk hadiah ini'); return; }
this.setState({ points: s.points - r.cost, history: [{ t: 'Menukar: ' + r.title, s: 'Voucher dikirim ke email', p: '−' + r.cost }].concat(s.history) });
this.toast('Voucher berhasil ditukar');
}
});
}),
hasHistory: s.history.length > 0,
noHistory: s.history.length === 0,
hist: s.history.slice(0, 5).map((h, i, a) => ({
t: h.t, s: h.s, p: h.p,
pc: h.p.charAt(0) === '+' ? '#1D6B3F' : '#9E2F23',
dot: h.p.charAt(0) === '+' ? '#1D6B3F' : h.p ? '#9E2F23' : '#283B8E',
line: i < a.length - 1 ? '1px solid #F1EEE7' : 'none'
})),
scanTotal: (12480 + s.scans).toLocaleString('id-ID'),
orgTotal: (3210 + s.orgBuys).toLocaleString('id-ID'),
journeyTotal: (2140 + s.journeys).toLocaleString('id-ID'),
chRows: [['Kapas', 42], ['Tenun & celup', 26], ['Pengiriman', 15], ['Pakai & cuci', 13], ['Akhir pakai', 34]].map((r, i) => ({ n: r[0], sec: r[1], w: Math.round(r[1] / 42 * 100) + '%', you: s.watched[i] })),
sim: simDefs.map(d => {
const on = s[d.key];
return {
label: (on ? '✓ ' : '+ ') + d.label, on,
bg: on ? '#F4A93B' : 'transparent',
fg: on ? '#14171F' : '#FFFFFF',
border: on ? '1px solid #F4A93B' : '1px solid #4A5068',
toggle: () => this.setState({ [d.key]: !on, audit: false })
};
}),
simKg: this.num(simKg),
simGrade,
simGradeBg: simGrade === 'A' ? '#1D6B3F' : '#3C7F4D',
auditOpen: !s.audit,
auditSent: s.audit,
auditBg: noChange ? '#6B6F7C' : '#FFFFFF',
auditLabel: noChange ? 'Pilih perubahan untuk disimulasikan' : 'Ajukan audit ulang untuk skor baru',
sendAudit: () => {
if (noChange) { this.toast('Aktifkan minimal satu perubahan dulu'); return; }
this.setState({ audit: true });
this.toast('Permintaan audit terkirim ke verifikator');
}
};
}
render() {
const V = this.renderVals();
return html`<div style="width: 460px; height: 940px; position: relative; overflow: hidden; background: #ECE8E0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14171F">
<div style="position: absolute; left: 19px; top: 30px; width: 421px; height: 880px; border-radius: 66px; padding: 4px; box-sizing: border-box; background: linear-gradient(150deg, #5C5F68 0%, #26272C 36%, #4B4D54 68%, #2A2B30 100%); box-shadow: 0 50px 80px -34px rgba(20, 23, 31, 0.55), 0 18px 34px -18px rgba(20, 23, 31, 0.4)">
<div style="position: absolute; left: -3px; top: 156px; width: 3px; height: 30px; border-radius: 2px 0 0 2px; background: #3A3B41"></div>
<div style="position: absolute; left: -3px; top: 214px; width: 3px; height: 58px; border-radius: 2px 0 0 2px; background: #3A3B41"></div>
<div style="position: absolute; left: -3px; top: 284px; width: 3px; height: 58px; border-radius: 2px 0 0 2px; background: #3A3B41"></div>
<div style="position: absolute; right: -3px; top: 236px; width: 3px; height: 92px; border-radius: 0 2px 2px 0; background: #3A3B41"></div>
<div style="width: 413px; height: 872px; border-radius: 62px; padding: 10px; box-sizing: border-box; background: #07080A">
<div style="position: relative; width: 393px; height: 852px; border-radius: 52px; overflow: hidden; background: #F7F5F0">


<div style="position: absolute; inset: 0; background: #F7F5F0; opacity: ${V.scr.home.op}; visibility: ${V.scr.home.vis}; pointer-events: ${V.scr.home.pe}; transform: ${V.scr.home.tf}; transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s">
